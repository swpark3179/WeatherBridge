# XcodeGen 프로젝트 정의. Xcode 프로젝트는 커밋하지 않고 이 파일로 생성한다.
#   brew install xcodegen && cd ios && xcodegen generate
name: WeatherBridge

options:
  bundleIdPrefix: io.github.swpark3179
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    # 팀 ID·서버 접속 정보는 저장소에 넣지 않고 빌드할 때 넘긴다 (.github/workflows/ios-testflight.yml)
    DEVELOPMENT_TEAM: ""
    WB_SUPABASE_PROJECT_REF: ""
    WB_SUPABASE_PUBLISHABLE_KEY: ""
  configs:
    Debug:
      CODE_SIGN_STYLE: Automatic
      WB_APS_ENVIRONMENT: development
      WB_APNS_ENV: sandbox
    # TestFlight 빌드: 배포 인증서 + App Store 프로파일로 수동 서명 (docs/setup.md)
    Release:
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: Apple Distribution
      WB_APS_ENVIRONMENT: production
      WB_APNS_ENV: production

packages:
  WeatherCore:
    path: Packages/WeatherCore

targets:
  WeatherBridge:
    type: application
    platform: iOS
    sources:
      - path: WeatherBridge
      - path: Shared
    dependencies:
      - package: WeatherCore
      - target: CommuteWidget
    info:
      path: WeatherBridge/Info.plist
      properties:
        CFBundleDisplayName: WeatherBridge
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSSupportsLiveActivities: true
        UIBackgroundModes: [remote-notification]
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: 현재 위치를 집이나 회사로 등록할 때만 씁니다. 좌표는 약 1km 단위로 반올림해 저장합니다.
        WBSupabaseProjectRef: $(WB_SUPABASE_PROJECT_REF)
        WBSupabasePublishableKey: $(WB_SUPABASE_PUBLISHABLE_KEY)
        WBApnsEnv: $(WB_APNS_ENV)
    entitlements:
      path: WeatherBridge/WeatherBridge.entitlements
      properties:
        aps-environment: $(WB_APS_ENVIRONMENT)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.swpark3179.weatherbridge
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          PROVISIONING_PROFILE_SPECIFIER: WeatherBridge AppStore

  CommuteWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: CommuteWidget
      - path: Shared
    dependencies:
      - package: WeatherCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: CommuteWidget/Info.plist
      properties:
        CFBundleDisplayName: WeatherBridge
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.swpark3179.weatherbridge.CommuteWidget
      configs:
        Release:
          PROVISIONING_PROFILE_SPECIFIER: WeatherBridge Widget AppStore

schemes:
  WeatherBridge:
    build:
      targets:
        WeatherBridge: all
        CommuteWidget: all
    run:
      config: Debug
    archive:
      config: Release
