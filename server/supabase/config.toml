# Supabase CLI 설정. project_id는 로컬 식별자일 뿐이며 실제 프로젝트는 SUPABASE_PROJECT_ID로 연결한다.
project_id = "weatherbridge"

# Phase 0 스파이크·Phase 1 함수는 운영 토큰 헤더(x-spike-token)로 자체 인증한다.
[functions.spike-reach]
verify_jwt = false

[functions.spike-apns]
verify_jwt = false

[functions.refresh]
verify_jwt = false

[functions.forecast]
verify_jwt = false

[functions.briefing]
verify_jwt = false

# 매분 pg_cron이 운영 토큰(x-spike-token)으로 호출
[functions.dispatch]
verify_jwt = false

# 실기기 점검(Device check 워크플로)
[functions.ops-status]
verify_jwt = false

# 앱 사용자 JWT는 함수 안에서 @supabase/server가 JWKS로 검증한다.
# 플랫폼 검사는 레거시(HS256) 토큰만 이해하는 경우가 있어 끈다.
[functions.today]
verify_jwt = false

# 앱 여행 화면. today와 같은 방식으로 함수 안에서 사용자 JWT를 검증한다.
[functions.trips]
verify_jwt = false
