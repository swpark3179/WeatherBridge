name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (Deno)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno task fmt:check
      - run: deno task lint
      - run: deno task check
      - run: deno task test

  core:
    name: WeatherCore (swift test, Linux)
    runs-on: ubuntu-latest
    container: swift:6.2
    defaults:
      run:
        working-directory: ios/Packages/WeatherCore
    steps:
      - uses: actions/checkout@v4
      - run: swift test

  ios:
    name: iOS app (simulator build, unsigned)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode
        run: xcodebuild -version
      - name: Check app icon (1024×1024, no alpha)
        # App Store는 알파 채널이 있는 아이콘을 거부한다(ITMS-90717). 다시 만들려면 scripts/make_app_icon.py
        run: |
          python3 - <<'EOF'
          import struct
          head = open("WeatherBridge/Assets.xcassets/AppIcon.appiconset/AppIcon.png", "rb").read(26)
          width, height, _, color_type = struct.unpack(">IIBB", head[16:26])
          assert (width, height) == (1024, 1024), (width, height)
          assert color_type == 2, f"PNG color type {color_type} (RGB=2만 허용)"
          print("icon ok")
          EOF
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Check Release settings
        # XcodeGen 기본값이 project.yml 값을 덮어쓰면 TestFlight 실행에서야 드러나서 여기서 미리 본다
        run: |
          for plist in WeatherBridge/Info.plist CommuteWidget/Info.plist; do
            version="$(plutil -extract CFBundleShortVersionString raw -o - "$plist")"
            build="$(plutil -extract CFBundleVersion raw -o - "$plist")"
            echo "$plist: CFBundleShortVersionString=$version, CFBundleVersion=$build"
            if [ "$version" != '$(MARKETING_VERSION)' ] || [ "$build" != '$(CURRENT_PROJECT_VERSION)' ]; then
              echo "::error::$plist 버전이 빌드 설정(MARKETING_VERSION, CURRENT_PROJECT_VERSION)을 따르지 않습니다"
              exit 1
            fi
          done
          for target in WeatherBridge CommuteWidget; do
            settings="$(xcodebuild -project WeatherBridge.xcodeproj -target "$target" -configuration Release -showBuildSettings)"
            identity="$(sed -nE 's/^ *CODE_SIGN_IDENTITY = (.*)$/\1/p' <<<"$settings")"
            family="$(sed -nE 's/^ *TARGETED_DEVICE_FAMILY = (.*)$/\1/p' <<<"$settings")"
            echo "$target: CODE_SIGN_IDENTITY=$identity, TARGETED_DEVICE_FAMILY=$family"
            if [ "$identity" != "Apple Distribution" ] || [ "$family" != "1" ]; then
              echo "::error::$target Release 설정이 project.yml과 다릅니다 (Apple Distribution, 아이폰 전용이어야 함)"
              exit 1
            fi
          done
      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project WeatherBridge.xcodeproj \
            -scheme WeatherBridge \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build | tee build.log | grep -E "error:|warning: .*(Sendable|retroactive)|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: ios/build.log
