name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (Deno)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno task fmt:check
      - run: deno task lint
      - run: deno task check
      - run: deno task test

  core:
    name: WeatherCore (swift test, Linux)
    runs-on: ubuntu-latest
    container: swift:6.2
    defaults:
      run:
        working-directory: ios/Packages/WeatherCore
    steps:
      - uses: actions/checkout@v4
      - run: swift test

  ios:
    name: iOS app (simulator build, unsigned)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode
        run: xcodebuild -version
      - name: Check app icon (1024×1024, no alpha)
        # App Store는 알파 채널이 있는 아이콘을 거부한다(ITMS-90717). 다시 만들려면 scripts/make_app_icon.py
        run: |
          python3 - <<'EOF'
          import struct
          head = open("WeatherBridge/Assets.xcassets/AppIcon.appiconset/AppIcon.png", "rb").read(26)
          width, height, _, color_type = struct.unpack(">IIBB", head[16:26])
          assert (width, height) == (1024, 1024), (width, height)
          assert color_type == 2, f"PNG color type {color_type} (RGB=2만 허용)"
          print("icon ok")
          EOF
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project WeatherBridge.xcodeproj \
            -scheme WeatherBridge \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build | tee build.log | grep -E "error:|warning: .*(Sendable|retroactive)|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: ios/build.log
