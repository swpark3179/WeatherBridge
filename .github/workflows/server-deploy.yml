name: Server deploy

# 마이그레이션 적용 + 함수 시크릿 동기화 + Edge Functions 배포.
# 필요한 Actions secrets: SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, SUPABASE_PROJECT_ID, SPIKE_TOKEN
# (선택) KMA_SERVICE_KEY, APPLE_TEAM_ID·APNS_KEY_ID·APNS_P8 — 있으면 함수 시크릿으로 함께 등록한다.
# 자세한 내용은 docs/setup.md
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["server/supabase/**"]

permissions:
  contents: read

concurrency:
  group: server-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        run: |
          missing=""
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD PROJECT_ID; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Actions secrets가 없습니다:$missing (docs/setup.md 참고)"
            exit 1
          fi
          # 붙여넣기로 섞인 앞뒤 공백·줄바꿈은 DB 인증 실패(28P01)로만 보여서 미리 잡는다. 값은 출력하지 않는다.
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD PROJECT_ID; do
            if [[ "${!v}" =~ ^[[:space:]] || "${!v}" =~ [[:space:]]$ ]]; then
              echo "::error::$v 값 앞뒤에 공백이나 줄바꿈이 있습니다. Actions secret을 다시 붙여넣어 주세요"
              exit 1
            fi
          done
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - name: Link project
        run: supabase link --project-ref "$PROJECT_ID"
      - name: Apply migrations
        run: supabase db push
      - name: Sync function secrets
        env:
          SPIKE_TOKEN: ${{ secrets.SPIKE_TOKEN }}
          KMA_SERVICE_KEY: ${{ secrets.KMA_SERVICE_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          APNS_P8: ${{ secrets.APNS_P8 }}
        run: |
          args=()
          [ -n "$SPIKE_TOKEN" ] && args+=("SPIKE_TOKEN=$SPIKE_TOKEN")
          [ -n "$KMA_SERVICE_KEY" ] && args+=("KMA_SERVICE_KEY=$KMA_SERVICE_KEY")
          # APNs 키 3개는 함께 있어야 쓸모가 있다. .p8은 여러 줄이라 줄바꿈을 빼고 한 줄로 넘긴다(함수가 그대로 읽는다).
          if [ -n "$APPLE_TEAM_ID" ] && [ -n "$APNS_KEY_ID" ] && [ -n "$APNS_P8" ]; then
            args+=("APNS_TEAM_ID=$(printf '%s' "$APPLE_TEAM_ID" | tr -d '[:space:]')")
            args+=("APNS_KEY_ID=$(printf '%s' "$APNS_KEY_ID" | tr -d '[:space:]')")
            args+=("APNS_P8=$(printf '%s' "$APNS_P8" | tr -d '\r\n')")
          else
            echo "::notice::APPLE_TEAM_ID·APNS_KEY_ID·APNS_P8 중 빠진 값이 있어 APNs 시크릿은 건너뜁니다"
          fi
          if [ ${#args[@]} -gt 0 ]; then
            supabase secrets set --project-ref "$PROJECT_ID" "${args[@]}"
          fi
          [ -n "$KMA_SERVICE_KEY" ] || echo "::notice::KMA_SERVICE_KEY가 없어 기상청 소스 없이 동작합니다"
      - name: Deploy functions
        run: supabase functions deploy --project-ref "$PROJECT_ID"
